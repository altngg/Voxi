server.port=8080

spring.datasource.url=jdbc:postgresql://localhost:5432/voxi_db
spring.datasource.username=voxi_user
spring.datasource.password=voxi_password
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update 
# validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

spring.liquibase.enabled=false
# spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.yaml true

jwt.secret=ThisIsAVeryLongSecretKeyForJWTThatIsExactly64CharactersLongEnough2024
jwt.access-token-expiration=900000
jwt.refresh-token-expiration=604800000

cookie.access-token-name=access_token
cookie.refresh-token-name=refresh_token
cookie.secure=false
cookie.http-only=true
cookie.same-site=Strict
cookie.path=/
cookie.max-age=604800

logging.level.com.voxi=DEBUG
logging.level.org.springframework.security=DEBUG

spring.application.name=java-service

cors.allowed-origins=http://localhost:3000,http://localhost:5173

# errors n logs
spring.web.error.include-message=always
spring.web.error.include-binding-errors=always
spring.web.error.include-stacktrace=always
spring.web.error.include-exception=true

logging.level.org.springframework.web=DEBUG
logging.level.com.example.java_service=DEBUG
